name: CPU baseline validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cpu-baseline.yml"
      - "benchmarks/**"
      - "src/**"
      - "tests/**"
      - "backends/**"
      - "examples/**"
  workflow_dispatch:

jobs:
  cpu-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Check out Deep Goose
        uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev

      - name: Install Python baseline dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned Goose v2026.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz \
            -o /tmp/goose.tar.gz
          mkdir -p /tmp/goose-dist
          tar -xzf /tmp/goose.tar.gz -C /tmp/goose-dist
          GOOSE_EXE="$(find /tmp/goose-dist -type f -name goose -print -quit)"
          test -n "$GOOSE_EXE"
          chmod +x "$GOOSE_EXE"
          echo "$(dirname "$GOOSE_EXE")" >> "$GITHUB_PATH"
          "$GOOSE_EXE" version

      - name: Compile and validate Goose benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          goose check benchmarks/goose/cpu_bench.goose
          goose build --cc clang -o build/goose_cpu_bench benchmarks/goose/cpu_bench.goose

      - name: Compile and execute Goose library regression tests
        shell: bash
        run: |
          set -euo pipefail
          goose check tests/goose/cpu_ops.goose
          goose build --cc clang -o build/cpu_ops_test tests/goose/cpu_ops.goose
          ./build/cpu_ops_test

      - name: Validate numerically stable classification operators
        shell: bash
        run: |
          set -euo pipefail
          goose check tests/goose/classification.goose
          goose build --cc clang -o build/classification_test tests/goose/classification.goose
          ./build/classification_test

      - name: Verify multiclass CPU classification learning
        shell: bash
        run: |
          set -euo pipefail
          goose check examples/classification/train.goose
          goose build --cc clang -o build/goose_classification_train examples/classification/train.goose
          ./build/goose_classification_train

      - name: Validate portable dense-parameter checkpointing
        shell: bash
        run: |
          set -euo pipefail
          goose check tests/goose/checkpoint.goose
          goose build --cc clang -o build/checkpoint_test tests/goose/checkpoint.goose
          ./build/checkpoint_test

      - name: Test analytical gradients and nonlinear XOR training
        shell: bash
        run: |
          set -euo pipefail
          goose check tests/goose/gradient_check.goose
          goose build --cc clang -o build/goose_gradient_check tests/goose/gradient_check.goose
          ./build/goose_gradient_check
          goose check examples/xor/train.goose
          goose build --cc clang -o build/goose_xor_train examples/xor/train.goose
          ./build/goose_xor_train

      - name: Compile C baseline
        run: |
          clang -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Werror -o build/c_cpu_bench benchmarks/c/cpu_bench.c

      - name: Compile regression training baselines
        shell: bash
        run: |
          set -euo pipefail
          goose check examples/regression/train.goose
          goose build --cc clang -o build/goose_regression_train examples/regression/train.goose
          clang -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Werror -o build/c_regression_train benchmarks/c/regression_train.c

      - name: Validate and benchmark CPU training
        run: |
          python3 benchmarks/runner/train_compare.py \
            --goose build/goose_regression_train \
            --c build/c_regression_train \
            --implementations goose,c,python_loop,numpy,torch_cpu \
            --trials 3 --output benchmarks/reports/training-ci

      - name: Compile Adam training baselines
        shell: bash
        run: |
          set -euo pipefail
          goose check examples/regression/adam.goose
          goose build --cc clang -o build/goose_adam_train examples/regression/adam.goose
          clang -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Werror -o build/c_adam_train benchmarks/c/regression_adam.c -lm

      - name: Validate and compare Adam CPU training
        run: |
          python3 benchmarks/runner/train_compare.py \
            --optimizer adam \
            --goose build/goose_adam_train \
            --c build/c_adam_train \
            --implementations goose,c,python_loop,numpy,torch_cpu \
            --trials 3 --output benchmarks/reports/adam-ci

      - name: Validate tabular RL in Goose and compare C/Python
        shell: bash
        run: |
          set -euo pipefail
          goose check examples/rl/lineworld.goose
          goose build --cc clang -o build/goose_lineworld examples/rl/lineworld.goose
          clang -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Werror -o build/c_lineworld benchmarks/c/lineworld.c
          ./build/goose_lineworld
          ./build/c_lineworld
          python3 benchmarks/python/lineworld.py

      - name: Validate native CPU DQN end-to-end training
        shell: bash
        run: |
          set -euo pipefail
          goose check examples/dqn/lineworld.goose
          goose build --cc clang -o build/goose_dqn_lineworld examples/dqn/lineworld.goose
          ./build/goose_dqn_lineworld

      - name: Compile BLAS-backed baselines
        shell: bash
        run: |
          set -euo pipefail
          goose check benchmarks/goose/blas_bench.goose
          goose build --cc clang -o build/goose_blas_bench benchmarks/goose/blas_bench.goose
          clang -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Werror -o build/c_blas_bench benchmarks/c/blas_bench.c -lopenblas
          clang -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
            -DDEEP_GOOSE_ADAPTER_BENCH -Wall -Wextra -Werror \
            -o build/c_blas_adapter_bench \
            benchmarks/c/blas_bench.c backends/blas/native/gemm.c -lopenblas

      - name: Verify BLAS numerical outputs element by element
        shell: bash
        run: |
          set -euo pipefail
          goose check tests/goose/blas_reference.goose
          goose build --cc clang -o build/blas_reference tests/goose/blas_reference.goose
          ./build/blas_reference

      - name: Run reproducible smoke benchmarks
        run: |
          python3 benchmarks/runner/compare.py \
            --goose build/goose_cpu_bench \
            --c build/c_cpu_bench \
            --goose-blas build/goose_blas_bench \
            --c-blas build/c_blas_bench \
            --c-blas-adapter build/c_blas_adapter_bench \
            --implementations goose,c,python_loop,numpy,torch_cpu,goose_blas,c_blas,c_blas_adapter \
            --mode smoke --trials 3 \
            --output benchmarks/reports/ci

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-baseline-evidence
          path: |
            benchmarks/reports/ci/
            benchmarks/reports/training-ci/
            benchmarks/reports/adam-ci/
          if-no-files-found: warn
