name: CPU baseline validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cpu-baseline.yml"
      - "benchmarks/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  cpu-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Check out Deep Goose
        uses: actions/checkout@v4

      - name: Install Python baseline dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned Goose v2026.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz \
            -o /tmp/goose.tar.gz
          mkdir -p /tmp/goose-dist
          tar -xzf /tmp/goose.tar.gz -C /tmp/goose-dist
          GOOSE_EXE="$(find /tmp/goose-dist -type f -name goose -print -quit)"
          test -n "$GOOSE_EXE"
          chmod +x "$GOOSE_EXE"
          echo "$(dirname "$GOOSE_EXE")" >> "$GITHUB_PATH"
          "$GOOSE_EXE" version

      - name: Compile and validate Goose benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          goose check benchmarks/goose/cpu_bench.goose
          goose build --cc clang -o build/goose_cpu_bench benchmarks/goose/cpu_bench.goose

      - name: Compile and execute Goose library regression tests
        shell: bash
        run: |
          set -euo pipefail
          goose check tests/goose/cpu_ops.goose
          goose build --cc clang -o build/cpu_ops_test tests/goose/cpu_ops.goose
          ./build/cpu_ops_test

      - name: Compile C baseline
        run: |
          clang -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Werror -o build/c_cpu_bench benchmarks/c/cpu_bench.c

      - name: Compile regression training baselines
        shell: bash
        run: |
          set -euo pipefail
          goose check examples/regression/train.goose
          goose build --cc clang -o build/goose_regression_train examples/regression/train.goose
          clang -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Werror -o build/c_regression_train benchmarks/c/regression_train.c

      - name: Validate and benchmark CPU training
        run: |
          python3 benchmarks/runner/train_compare.py \
            --goose build/goose_regression_train \
            --c build/c_regression_train \
            --implementations goose,c,python_loop,numpy,torch_cpu \
            --trials 3 --output benchmarks/reports/training-ci

      - name: Run reproducible smoke benchmarks
        run: |
          python3 benchmarks/runner/compare.py \
            --goose build/goose_cpu_bench \
            --c build/c_cpu_bench \
            --implementations goose,c,python_loop,numpy,torch_cpu \
            --mode smoke --trials 3 \
            --output benchmarks/reports/ci

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-baseline-evidence
          path: |
            benchmarks/reports/ci/
            benchmarks/reports/training-ci/
          if-no-files-found: warn
